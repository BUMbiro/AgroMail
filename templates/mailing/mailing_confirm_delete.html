{% extends "base.html" %}

{% block title %}Удалить рассылку — АгроПочта{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="text-center mb-4 section-title">Удалить рассылку?</h2>
            <p class="text-center">
                Вы уверены, что хотите удалить рассылку <strong>#{{ mailing.pk }} ({{ mailing.message.subject }})</strong>?
            </p>
            <form method="post" class="text-center">
                {% csrf_token %}
                <button type="submit" class="btn btn-agro-danger">Да, удалить</button>
                <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
