{% extends "base.html" %}
{% block title %}Новый пароль — АгроПочта{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5"><div class="card p-4">
    <h2 class="text-center mb-4 section-title">Новый пароль</h2>
    <form method="post">{% csrf_token %}
        {% for field in form %}
            <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Сохранить пароль</button>
    </form>
</div></div></div>
{% endblock %}
