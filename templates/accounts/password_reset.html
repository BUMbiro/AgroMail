{% extends "base.html" %}
{% block title %}Восстановление пароля — АгроПочта{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5"><div class="card p-4">
    <h2 class="text-center mb-4 section-title">Восстановление пароля</h2>
    <p class="text-muted small">Введите свой email, и мы отправим ссылку для сброса пароля (в консоль).</p>
    <form method="post">{% csrf_token %}
        {% for field in form %}
            <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
    </form>
</div></div></div>
{% endblock %}
